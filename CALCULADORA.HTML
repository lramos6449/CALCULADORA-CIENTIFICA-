<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Web Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #121214;
        }

        .calculadora {
            background-color: #1e1e24;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            width: 320px;
        }

        .pantalla {
            width: 100%;
            height: 70px;
            background-color: #2a2a32;
            border: none;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #ffffff;
            text-align: right;
            padding: 15px;
            font-size: 2rem;
            outline: none;
        }

        .botones {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            padding: 18px;
            font-size: 1.25rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: #33333f;
            color: #ffffff;
            transition: background 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        button.operador {
            background-color: #ff9f0a;
            color: #ffffff;
            font-weight: bold;
        }

        button.operador:hover {
            background-color: #e08b07;
        }

        button.accion {
            background-color: #a5a5a5;
            color: #000000;
        }

        button.accion:hover {
            background-color: #8e8e8e;
        }

        button.doble {
            grid-column: span 2;
        }

        button:hover {
            background-color: #444452;
        }
    </style>
</head>
<body>

    <div class="calculadora">
        <!-- Pantalla de visualización -->
        <input type="text" class="pantalla" id="pantalla" readonly value="0">
        
        <!-- Matriz de botones -->
        <div class="botones">
            <button class="accion" onclick="limpiarPantalla()">C</button>
            <button class="accion" onclick="borrarUltimo()">←</button>
            <button class="operador" onclick="agregarOperador('/')">÷</button>
            <button class="operador" onclick="agregarOperador('*')">×</button>

            <button onclick="agregarNumero('7')">7</button>
            <button onclick="agregarNumero('8')">8</button>
            <button onclick="agregarNumero('9')">9</button>
            <button class="operador" onclick="agregarOperador('-')">-</button>

            <button onclick="agregarNumero('4')">4</button>
            <button onclick="agregarNumero('5')">5</button>
            <button onclick="agregarNumero('6')">6</button>
            <button class="operador" onclick="agregarOperador('+')">+</button>

            <button onclick="agregarNumero('1')">1</button>
            <button onclick="agregarNumero('2')">2</button>
            <button onclick="agregarNumero('3')">3</button>
            <button class="operador doble" onclick="calcular()">=</button>

            <button class="doble" onclick="agregarNumero('0')">0</button>
            <button onclick="agregarNumero('.')">.</button>
        </div>
    </div>

    <script>
        const pantalla = document.getElementById('pantalla');
        let operacionNueva = true;

        function agregarNumero(numero) {
            // Evitar múltiples puntos decimales en un mismo número
            if (numero === '.' && pantalla.value.includes('.')) return;
            
            if (pantalla.value === '0' || operacionNueva) {
                pantalla.value = numero;
                operacionNueva = false;
            } else {
                pantalla.value += numero;
            }
        }

        function agregarOperador(operador) {
            const ultimoCaracter = pantalla.value.slice(-1);
            // Evitar poner dos operadores seguidos
            if (['+', '-', '*', '/'].includes(ultimoCaracter)) {
                pantalla.value = pantalla.value.slice(0, -1) + operador;
            } else {
                pantalla.value += operador;
                operacionNueva = false;
            }
        }

        function limpiarPantalla() {
            pantalla.value = '0';
            operacionNueva = true;
        }

        function borrarUltimo() {
            if (pantalla.value.length > 1) {
                pantalla.value = pantalla.value.slice(0, -1);
            } else {
                pantalla.value = '0';
                operacionNueva = true;
            }
        }

        function calcular() {
            try {
                // eval() procesa la cadena matemática directamente
                let resultado = eval(pantalla.value);
                
                // Manejo de divisiones por cero
                if (resultado === Infinity || resultado === -Infinity) {
                    pantalla.value = "Error";
                } else {
                    pantalla.value = resultado;
                }
                operacionNueva = true;
            } catch (error) {
                pantalla.value = "Error";
                operacionNueva = true;
            }
        }
    </script>
</body>
</html>
